  recording_guide: "模块: /V25_2500（测试部专用）/B类解耦商店应用/截图录屏/V25新需求(#129855)\n用例数: 116\n\
    \n操作指引 (来自帮助手册):\n# 截图\n\n在截图模式下，单击工具栏上的按钮，您可以在截图区域进行图形绘制、文字批注等操作，并可以识别图中文字、将图片置顶贴在桌面上、使用**AI截图**对截图内容进行解释、总结、翻译等。\n\
    \n\n![0|截图工具栏](fig/capturebar.png)\n\n<table class=\"block1\">\n    <caption>工具栏说明</caption>\n\
    \    <tbody>\n        <tr>\n            <td style=\"text-align:center;\"><img\
    \ src=\"../common/bar_geometric.svg\" alt=\"几何工具\" class=\"inline\" /></td>\n\
