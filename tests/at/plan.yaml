    用例数: 1\n\n操作指引 (来自帮助手册):\n# 截图\n\n在截图模式下，单击工具栏上的按钮，您可以在截图区域进行图形绘制、文字批注等操作，并可以识别图中文字、将图片置顶贴在桌面上、使用**AI截图**对截图内容进行解释、总结、翻译等。\n\
