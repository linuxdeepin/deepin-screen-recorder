    \ alt=\"文字\" class=\"inline\" /></td>\n            <td>文字</td>\n        </tr>\n\
    \        <tr>\n            <td style=\"text-align:center;\"><img src=\"../common/scrollshot.svg\"\
    \ alt=\"滚动截图\" class=\"inline\" /></td>\n            <td>滚动截图</td>\n         \
    \   <td style=\"text-align:center;\"><img src=\"../common/ocr.svg\" alt=\"识别文字\"\
    \ class=\"inline\" /></td>\n            <td>识别文字</td>\n            <td style=\"\
    text-align:center;\"><img src=\"../common/pin.svg\" alt=\"贴图\" class=\"inline\"\
    \ /></td>\n            <td>贴图</td>\n        </tr>\n        <tr>\n            <td\
    \ style=\"text-align:center;\"><img src=\"../common/bar_ai.svg\" alt=\"AI截图\"\
    \ class=\"inline\" /></td>\n            <td>AI截图</td>\n            <td style=\"\
