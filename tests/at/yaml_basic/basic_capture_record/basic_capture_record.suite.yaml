- id: basic_hotkey_select_region_enter_copy_clipboard
  name: Ctrl+Alt+A 启动截图，框选区域后按 Enter 复制到系统剪贴板
  tags:
  - screenshot
  - clipboard
  - keyboard
  steps:
  - action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      rm -f /tmp/youqu_dsr_basic_enter_clipboard.ok;
      python3 -c "import configparser, os, shutil; p=os.path.expanduser(\"~/.config/deepin/deepin-screen-recorder/deepin-screen-recorder.conf\"); bak=\"/tmp/youqu_dsr_basic/deepin-screen-recorder.conf.bak\"; os.makedirs(os.path.dirname(bak), exist_ok=True); (os.path.exists(p) and not os.path.exists(bak)) and shutil.copy2(p,bak); c=configparser.ConfigParser(); c.read(p); (not c.has_section(\"shot\")) and c.add_section(\"shot\"); c.set(\"shot\",\"save_ways\",\"1\"); c.set(\"shot\",\"save_op\",\"0\"); c.set(\"shot\",\"save_dir_change\",\"false\"); c.set(\"shot\",\"format\",\"0\"); open(p,\"w\").write(\"\".join([\"[\"+s+\"]\\n\"+\"\".join(k+\"=\"+v+\"\\n\" for k,v in c[s].items())+\"\\n\" for s in c.sections()]))";
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5;
      xdotool key --clearmodifiers ctrl+alt+a;
      sleep 1.2;
      xdotool mousemove 330 230 mousedown 1;
      sleep 0.1;
      xdotool mousemove 900 600 mouseup 1;
      sleep 1.0;
      python3 /tmp/youqu_dsr_basic/assert_at_name.py save_local_button;
      xdotool key --clearmodifiers Return;
      sleep 1.5;
      YOUQU_CLIPBOARD_MARKER=/tmp/youqu_dsr_basic_enter_clipboard.ok python3 /tmp/youqu_dsr_basic/check_clipboard_image.py'
    wait: 45.0
  assert_steps:
  - action: assert_file_exists
    path: /tmp/youqu_dsr_basic_enter_clipboard.ok

- id: basic_hotkey_select_region_double_click_copy_clipboard
  name: Ctrl+Alt+A 启动截图，框选区域后双击选区复制到系统剪贴板
