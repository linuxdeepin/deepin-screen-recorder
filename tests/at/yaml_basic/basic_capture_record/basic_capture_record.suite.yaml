      python3 -c "import configparser, os, shutil, sys; p=os.path.expanduser(\"~/.config/deepin/deepin-screen-recorder/deepin-screen-recorder.conf\"); bak=\"/tmp/youqu_dsr_basic/deepin-screen-recorder.conf.bak\"; os.makedirs(os.path.dirname(bak), exist_ok=True); (os.path.exists(p) and not os.path.exists(bak)) and shutil.copy2(p,bak); c=configparser.ConfigParser(); c.read(p); (not c.has_section(\"shot\")) and c.add_section(\"shot\"); c.set(\"shot\",\"save_ways\",\"1\"); c.set(\"shot\",\"save_op\",\"3\"); c.set(\"shot\",\"save_dir\",sys.argv[1]); c.set(\"shot\",\"save_dir_change\",\"false\"); c.set(\"shot\",\"format\",\"0\"); open(p,\"w\").write(\"\".join([\"[\"+s+\"]\\n\"+\"\".join(k+\"=\"+v+\"\\n\" for k,v in c[s].items())+\"\\n\" for s in c.sections()]))" "$outdir";
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true; sleep 0.5;
      xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2; xdotool mousemove 340 240 mousedown 1; sleep 0.1; xdotool mousemove 900 600 mouseup 1; sleep 1.0;
      python3 /tmp/youqu_dsr_basic/click_at_name.py save_local_button; sleep 1.0;
      f=$(find "$outdir" -type f -name "*.png" | head -n 1); [ -n "$f" ] && [ -s "$f" ] || exit 1;
