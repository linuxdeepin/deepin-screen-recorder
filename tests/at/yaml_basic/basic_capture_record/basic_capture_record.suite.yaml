- id: basic_record_region_save_mp4
  name: Ctrl+Alt+R 启动录屏，框选区域后按 Enter 开始录制，再按 Ctrl+Alt+R 停止并生成 MP4 文件
  tags:
  - record
  - mp4
  - save
  steps:
  - action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      rm -f /tmp/youqu_dsr_basic_record_mp4.ok;
      rm -rf /tmp/youqu_dsr_basic/record; mkdir -p /tmp/youqu_dsr_basic/record;
      python3 -c "import configparser, os, shutil; p=os.path.expanduser(\"~/.config/deepin/deepin-screen-recorder/deepin-screen-recorder.conf\"); bak=\"/tmp/youqu_dsr_basic/deepin-screen-recorder.conf.bak\"; os.makedirs(os.path.dirname(bak), exist_ok=True); (os.path.exists(p) and not os.path.exists(bak)) and shutil.copy2(p,bak); c=configparser.ConfigParser(); c.read(p); (not c.has_section(\"recorder\")) and c.add_section(\"recorder\"); c.set(\"recorder\",\"format\",\"1\"); c.set(\"recorder\",\"frame_rate\",\"5\"); c.set(\"recorder\",\"save_op\",\"0\"); c.set(\"recorder\",\"save_dir\",\"/tmp/youqu_dsr_basic/record\"); c.set(\"recorder\",\"audio\",\"0\"); c.set(\"recorder\",\"cursor\",\"0\"); open(p,\"w\").write(\"\".join([\"[\"+s+\"]\\n\"+\"\".join(k+\"=\"+v+\"\\n\" for k,v in c[s].items())+\"\\n\" for s in c.sections()]))";
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopRecord >/dev/null 2>&1 || true;
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5'
    wait: 2.0
  - action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority}; xdotool key --clearmodifiers ctrl+alt+r'
    wait: 1.5
  - action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      xdotool mousemove 360 260 mousedown 1;
      sleep 0.1;
      xdotool mousemove 660 500 mouseup 1'
    wait: 1.5
  - action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority}; xdotool key --clearmodifiers Return'
    wait: 10.0
  - action: session_start
    command: |
      bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority}; xdotool key --clearmodifiers ctrl+alt+r'
    wait: 2.0
  assert_steps:
  - action: session_start
    command: |
      bash -lc 'for i in $(seq 1 60); do
        if ! pgrep -f "ffmpeg.*x11grab|ffmpeg.*Screen Recordings" >/dev/null 2>&1; then
          f=$(find "/tmp/youqu_dsr_basic/record/Screen Recordings" -type f -name "*.mp4" 2>/dev/null | head -n 1);
          if [ -n "$f" ] && [ -s "$f" ]; then echo "$f" > /tmp/youqu_dsr_basic_record_mp4.ok; exit 0; fi;
        fi;
        sleep 0.5;
      done;
      f=$(find "/tmp/youqu_dsr_basic/record/Screen Recordings" -type f -name "*.mp4" 2>/dev/null | head -n 1);
      [ -n "$f" ] && [ -s "$f" ] && echo "$f" > /tmp/youqu_dsr_basic_record_mp4.ok'
    wait: 35.0
  - action: assert_file_exists
    path: /tmp/youqu_dsr_basic_record_mp4.ok

teardown:
- action: session_start
  command: |
    bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
    if [ -f /tmp/youqu_dsr_basic/deepin-screen-recorder.conf.bak ]; then
      mkdir -p "$HOME/.config/deepin/deepin-screen-recorder";
      cp /tmp/youqu_dsr_basic/deepin-screen-recorder.conf.bak "$HOME/.config/deepin/deepin-screen-recorder/deepin-screen-recorder.conf";
    fi;
    xdotool key --clearmodifiers Escape >/dev/null 2>&1 || true;
    gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true'
  wait: 0.5
- action: session_stop
