  - id: suite_record_basic_mp4
    name: "录屏-录制MP4格式"
    module: "recording"
    status: "active"
    annotation:
      测试界面: "录屏区域"
      测试功能: "MP4格式录制与保存"
      前置条件: "Ctrl+Alt+R 启动录屏"
      AT元素引用: ["to_record_but"]
    steps:
      - step_type: "action"
        description: "启动录屏，框选区域，按 Enter 开始录制，再按 Ctrl+Alt+R 停止"
        action: "session_start"
        command: "bash -lc 'xdotool key --clearmodifiers ctrl+alt+r; sleep 1.2; xdotool mousemove 360 260 mousedown 1; sleep 0.1; xdotool mousemove 660 500 mouseup 1; sleep 1.0; xdotool key --clearmodifiers Return; sleep 1.0; xdotool key --clearmodifiers ctrl+alt+r'"
      - step_type: "assert"
        description: "验证 MP4 录制生成"
        action: "assert_element"
        selector: {name: "to_record_but", role: "push button"}

