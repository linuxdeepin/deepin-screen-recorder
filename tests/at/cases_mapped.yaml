      测试功能: "截图后通过剪切板粘贴验证截图内容"
      前置条件: "deepin-screen-recorder 已安装"
      AT元素引用: ["save_local_button"]
    steps:
      - step_type: "action"
        description: "启动截图录屏"
        action: "session_start"
        command: "deepin-screen-recorder"
        wait: 3.0
      - step_type: "action"
        description: "点击键盘ctrl+alt+a 调起区域选择框"
        action: "keyboard_hot_key"
        key: "ctrl+alt+a"
      - step_type: "assert"
