cases:
  # =====================================================================
  # 模块：截图-基础捕获（截取/剪切板/保存）
  # =====================================================================
  - id: "screenshot_capture"
    name: "截图基础捕获流程"
    module: "screenshot-capture"
    status: "active"
    annotation:
      测试界面: "截图录屏主界面-截图模式"
      测试功能: "基础截图流程（窗口截图/剪切板验证/区域截图）"
      前置条件: "deepin-screen-recorder 已安装，桌面环境可用"
      AT元素引用: ["to_shot_but", "to_record_but", "toolbar_close_button", "save_local_button"]
    steps:
      - step_type: "action"
        description: "启动截图录屏"
        action: "session_start"
        command: "deepin-screen-recorder"
        wait: 3.0
      - step_type: "action"
        description: "鼠标光标停留在桌面窗口上"
        action: "element_action"
        selector: {name: "to_shot_but", role: "Button"}
        do: "click"
        note: "确保处于截图模式"
      - step_type: "action"
        description: "点击快捷键Alt+PrintScreen"
        action: "keyboard_hot_key"
        key: "alt+Print"
      - step_type: "assert"
        description: "应用窗口有光标显示（截取光标所在窗口）"
        action: "assert_element"
        selector: {name: "toolbar_close_button", role: "Button"}

