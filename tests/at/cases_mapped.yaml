version: '1.0'
cases:
- id: suite_圆角尺寸面板_001_s1
  name: 框选后圆角按钮和尺寸比例按钮显示
  module: 圆角尺寸面板
  steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: RoundedCornerButton
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: SizeRatioButton
- id: suite_圆角尺寸面板_002_s1
  name: 圆角面板展开后滑块和输入框显示
  module: 圆角尺寸面板
  steps:
  - step_type: action
    action: element_action
    selector:
      accessible_id: RoundedCornerButton
    do: click
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: CornerRadiusSlider
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: CornerRadiusSpinBox
- id: suite_圆角尺寸面板_003_s1
