name: screenshot_tools_part2_suite
app: deepin-screen-recorder
module: screenshot_tools_part2
setup:
- action: session_start
  command: deepin-screen-recorder
  wait: 3.0
suites:
- id: suite_screenshot_tools_part2_001_s1
  name: 录制鼠标选项-图标交互-勾选显示光标和点击
  description: ''
  steps:
  - action: keyboard_hot_key
    key: ctrl+alt+r
  - action: mouse_drag
    selector:
      name: SubToolWidget
      role: panel
    wait: 1
  - action: mouse_click
    selector:
      name: OptionButton
      role: panel
    wait: 1
  assert_steps:
  - action: assert_element
    selector:
      name: RecordOptionMenu
      role: panel
  - action: assert_element
    selector:
      name: OptionButton
      role: panel
- id: suite_screenshot_tools_part2_003_s1
