name: record_options_part1_suite
app: deepin-screen-recorder
module: record_options_part1
setup:
- action: session_start
  command: deepin-screen-recorder
  wait: 3.0
suites:
- id: suite_record_options_part1_001_s1
  name: 录屏-GIF 禁用录制音频
  description: ''
  steps:
  - action: keyboard_hot_key
    key: ctrl+alt+r
  - action: wait
  - action: mouse_click
    selector:
      name: OptionButton
      role: panel
  - action: mouse_click
    selector:
      name: GioButton
      role: panel
  assert_steps:
  - action: assert_element
    selector:
      name: SubToolWidget
      role: panel
  - action: assert_element
    selector:
      name: RecordOptionMenu
      role: panel
  - action: assert_element
    selector:
      name: GioButton
      role: panel
- id: suite_record_options_part1_003_s1
