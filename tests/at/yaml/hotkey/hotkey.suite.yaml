name: hotkey_suite
app: deepin-screen-recorder
description: ''
module: hotkey
tags: []
fast_fail: false
env_check: []
setup:
- action: session_start
  command: deepin-screen-recorder
  wait: 3.0
suites:
- id: hotkey_panel_s1
  name: 快捷键面板-OCR/Ctrl+Shift+?预览
