name: pin_table_recognition_suite
app: deepin-screen-recorder
description: 贴图表格识别：贴图表格识别按钮、结果对话框、复制按钮
module: pin_table_recognition
tags:
- at
- pin
- new-feature
- table-recognition
fast_fail: true
env_check: []
setup:
- action: session_start
  command: |
    bash -lc 'python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" init'
  wait: 0.5
suites:
- id: pin_table_recognition_button_display
  name: 贴图工具栏-表格识别按钮显示
  tags:
  - pin
  - new-feature
  - table-recognition
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" clear-marker pin_table_btn;
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5; xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2;
      xdotool mousemove 320 220 mousedown 1; sleep 0.1; xdotool mousemove 920 620 mouseup 1; sleep 1.0;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" assert-at-name save_local_button;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" click-at-name pinscreenshots_button; sleep 1.0;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" assert-at-name pin_table_but;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" mark pin_table_btn'
    wait: 12.0
  assert_steps:
  - action: session_start
    command: |
      bash -lc 'python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" assert-marker pin_table_btn'
    wait: 1.0
  - action: keyboard_press
    key: escape
    wait: 0.3

- id: pin_table_recognition_click_show_dialog
  name: 贴图表格识别-点击按钮后显示结果对话框
  tags:
  - pin
  - new-feature
  - table-recognition
  - dialog
  steps:
  - action: session_start
    command: |
      bash -lc 'set -e; export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" clear-marker pin_table_dialog;
      gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true;
      sleep 0.5; xdotool key --clearmodifiers ctrl+alt+a; sleep 1.2;
      xdotool mousemove 320 220 mousedown 1; sleep 0.1; xdotool mousemove 920 620 mouseup 1; sleep 1.0;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" assert-at-name save_local_button;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" click-at-name pinscreenshots_button; sleep 1.0;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" click-at-name pin_table_but; sleep 2.0;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" assert-at-name pin_table_result_dialog;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" assert-at-name table_result_copy_button;
      python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" mark pin_table_dialog'
    wait: 15.0
  assert_steps:
  - action: session_start
    command: |
      bash -lc 'python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" assert-marker pin_table_dialog'
    wait: 1.0
  - action: keyboard_press
    key: escape
    wait: 0.3

teardown:
- action: session_start
  command: |
    bash -lc 'export DISPLAY=${DISPLAY:-:0}; export XAUTHORITY=${XAUTHORITY:-$HOME/.Xauthority};
    python3 "$(git rev-parse --show-toplevel)/tests/at/yaml_basic/basic_capture_record/basic_capture_record_helper.py" restore;
    xdotool key --clearmodifiers Escape >/dev/null 2>&1 || true;
    gdbus call --session --dest com.deepin.ScreenRecorder --object-path /com/deepin/ScreenRecorder --method com.deepin.ScreenRecorder.stopApp >/dev/null 2>&1 || true'
  wait: 0.5
- action: session_stop
